<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengecam Bahasa Isyarat Malaysia (BIM)</title>
    
    <!-- Pustaka MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <!-- Pautan ke Fail CSS Luar -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Pengesanan Bahasa Isyarat Malaysia (BIM)</h1>
    <p>Tunjukkan Abjad (A-E), Angka (1-10), atau Isyarat "Saya" / "Kita" di depan kamera.</p>

    <div class="container">
        <!-- Elemen video tersembunyi, paparan diuruskan melalui canvas -->
        <video id="webcam" autoplay playsinline></video>
        <!-- Resolusi diselaraskan kepada 320x240 untuk kelancaran maksimum -->
        <canvas id="output_canvas" width="320" height="240"></canvas>
    </div>

    <div id="output-box">Menunggu kamera...</div>

    <!-- Pautan ke Fail JavaScript Luar -->
    <script src="script.js"></script>
</body>
</html>
