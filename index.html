<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BIM — Perkataan &amp; Angka 1–10</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="frame-app">
        <div class="top-strip">
            <span class="app-name">BIM Kamera</span>
            <span class="allowed-pill" id="allowed-pill">Memuatkan set...</span>
        </div>

        <div class="viewfinder">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>

            <div class="hud-top">
                <span class="tag ok" id="state-tag">AKTIF</span>
                <span class="tag" id="fps-tag">FPS: 0</span>
            </div>

            <div class="hud-bottom">
                <div id="live-sign">...</div>
                <div id="status-text">Memulakan kamera...</div>
            </div>
        </div>

        <div class="dock">
            <button class="btn-toggle" id="toggleBtn">Jeda</button>
            <button class="btn-reset" id="resetBtn">Set Semula</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
