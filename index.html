<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengesan Bahasa Isyarat Malaysia (BIM)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #34d399;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-align: center;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 28px;
            text-align: center;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            background-color: #0b0f19;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(56, 189, 248, 0.15);
        }

        #webcam {
            display: none;
        }

        #output_canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Efek cermin */
            object-fit: cover;
        }

        .result-box {
            margin-top: 24px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 20px 48px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            min-width: 240px;
            max-width: 640px;
            width: 100%;
            box-sizing: border-box;
        }

        .result-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        #text-output {
            font-size: 3.5rem;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 4px;
            line-height: 1.1;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            min-height: 60px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.875rem;
            color: var(--success-color);
            margin-top: 14px;
            font-weight: 600;
            background: rgba(52, 211, 153, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <h1>Pengesan Bahasa Isyarat Malaysia (BIM)</h1>
    <p>Gunakan isyarat tangan untuk Abjad (A-E), Angka (1-10), atau zon dada untuk "SAYA".</p>

    <div class="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>

    <div class="result-box">
        <div class="result-label">Teks Output</div>
        <div id="text-output">...</div>
        <div id="status-message" class="status">Memulakan kamera...</div>
    </div>

<script>
const videoElement = document.getElementById('webcam');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const textOutput = document.getElementById('text-output');
const statusMessage = document.getElementById('status-message');

// 1. LOGIK PEMETAAN ABJAD, ANGKA & PERKATAAN (BIM)
function tekaBIM(leftHandLandmarks, rightHandLandmarks, poseLandmarks) {
    let landmarks = rightHandLandmarks || leftHandLandmarks;
    
    if (!landmarks) return "...";

    let hujungTelunjuk = landmarks[8];
    let saizTangan = Math.sqrt(Math.pow(landmarks[5].x - landmarks[17].x, 2) + Math.pow(landmarks[5].y - landmarks[17].y, 2));
    if (saizTangan === 0) saizTangan = 0.1;

    // =================================================================
    // ZON 1: ZON BADAN & DADA (Isyarat: SAYA)
    // =================================================================
    if (poseLandmarks && poseLandmarks.length > 12) {
        let bahuKanan = poseLandmarks[11];
        let bahuKiri = poseLandmarks[12];

        let sempadanKiri = Math.min(bahuKanan.x, bahuKiri.x) - 0.05;
        let sempadanKanan = Math.max(bahuKanan.x, bahuKiri.x) + 0.05;
        let sempadanAtas = Math.min(bahuKanan.y, bahuKiri.y) - 0.02;
        let sempadanBawah = Math.max(bahuKanan.y, bahuKiri.y) + 0.30; 

        let diKawasanDada = (hujungTelunjuk.x >= sempadanKiri && hujungTelunjuk.x <= sempadanKanan) &&
                            (hujungTelunjuk.y >= sempadanAtas && hujungTelunjuk.y <= sempadanBawah);

        if (diKawasanDada) {
            let telunjukTerbukaDada = landmarks[8].y < landmarks[6].y;
            let tengahTerbukaDada = landmarks[12].y < landmarks[10].y;
            
            if (telunjukTerbukaDada && !tengahTerbukaDada) {
                return "SAYA";
            }
        }
    }

    // =================================================================
    // ZON 2: ZON BEBAS / NEUTRAL (Abjad A-E & Angka 1-10)
    // =================================================================
    let telunjukTerbuka = landmarks[8].y < landmarks[6].y;
    let tengahTerbuka = landmarks[12].y < landmarks[10].y;
    let manisTerbuka = landmarks[16].y < landmarks[14].y;
    let kelingkingTerbuka = landmarks[20].y < landmarks[18].y;

    let jarakIbuJariKeTelunjuk = Math.abs(landmarks[4].x - landmarks[5].x) / saizTangan;
    let ibuJariTerbuka = landmarks[4].y < landmarks[5].y || jarakIbuJariKeTelunjuk > 0.45;  

    let minX = Math.min(landmarks[5].x, landmarks[17].x);
    let maxX = Math.max(landmarks[5].x, landmarks[17].x);
    let ibuJariMelipatDiDepan = landmarks[4].x > minX && landmarks[4].x < maxX;

    // -----------------------------------------------------------------
    // A. LOGIK ABJAD BIM (A - E)
    // -----------------------------------------------------------------
    
    // Huruf A: Genggaman penuh
    if (!telunjukTerbuka && !tengahTerbuka && !manisTerbuka && !kelingkingTerbuka && !ibuJariTerbuka) {
        return "A";
    }

    // Huruf B: 4 jari terbuka tegak dan rapat
    let jariRapat = Math.abs(landmarks[8].x - landmarks[20].x) / saizTangan < 0.7;
    if (telunjukTerbuka && tengahTerbuka && manisTerbuka && kelingkingTerbuka && !ibuJariTerbuka && jariRapat) {
        return "B";
    }

    // Huruf C: Bentuk separuh bulatan (C-shape)
    let cShape = (landmarks[8].x > landmarks[4].x) && (landmarks[8].y >= landmarks[6].y);
    if (cShape && !tengahTerbuka && !manisTerbuka) {
        return "C";
    }

    // Huruf D: Telunjuk tegak, jari lain membentuk gelung
    let jarakIbuJariKeJariTengah = Math.abs(landmarks[4].x - landmarks[12].x) / saizTangan;
    if (telunjukTerbuka && !tengahTerbuka && !manisTerbuka && jarakIbuJariKeJariTengah < 0.35) {
        return "D";
    }

    // Huruf E: Semua jari melipat dengan ibu jari melintang di bawah
    let semuaJariMelipat = !telunjukTerbuka && !tengahTerbuka && !manisTerbuka && !kelingkingTerbuka;
    if (semuaJariMelipat && landmarks[4].y >= landmarks[6].y) {
        return "E";
    }

    // -----------------------------------------------------------------
    // B. LOGIK ANGKA BIM (1 - 10)
    // -----------------------------------------------------------------
    if (telunjukTerbuka && !tengahTerbuka && !manisTerbuka && !kelingkingTerbuka && !ibuJariMelipatDiDepan) {
        return "1";
    }
    
    if (telunjukTerbuka && tengahTerbuka && !manisTerbuka && !kelingkingTerbuka && !ibuJariTerbuka) {
        return "2";
    }
    
    if (ibuJariTerbuka && telunjukTerbuka && tengahTerbuka && !manisTerbuka && !kelingkingTerbuka) {
        if (jarakIbuJariKeTelunjuk > 0.8) return "8";
        return "3"; 
    }
    
    if (telunjukTerbuka && tengahTerbuka && manisTerbuka && kelingkingTerbuka && !ibuJariTerbuka && !jariRapat) {
        return "4";
    }

    if (ibuJariTerbuka && telunjukTerbuka && tengahTerbuka && manisTerbuka && kelingkingTerbuka) {
        return "5";
    }

    if (ibuJariTerbuka && !telunjukTerbuka && !tengahTerbuka && !manisTerbuka && !kelingkingTerbuka) {
        return "6";
    }

    if (ibuJariTerbuka && telunjukTerbuka && !tengahTerbuka && !manisTerbuka && !kelingkingTerbuka) {
        return "7";
    }

    if (ibuJariTerbuka && telunjukTerbuka && tengahTerbuka && manisTerbuka && !kelingkingTerbuka) {
        return "9";
    }
    
    if (!ibuJariTerbuka && !telunjukTerbuka && !tengahTerbuka && !manisTerbuka && !kelingkingTerbuka) {
        return "10 (Genggam & Goyang)";
    }

    return "...";
}

// 2. FUNGSI PENGENDALI HASIL PENGESANAN (HOLISTIC)
function onResults(results) {
    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

    if (results.poseLandmarks || results.leftHandLandmarks || results.rightHandLandmarks) {
        statusMessage.innerText = "Sistem Aktif: Mengesan Isyarat...";
        statusMessage.style.color = "#34d399";

        if (results.faceLandmarks) {
            drawConnectors(canvasCtx, results.faceLandmarks, FACEMESH_TESSELATION, {color: '#C0C0C020', lineWidth: 1});
        }
        
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#34d399', lineWidth: 2});
            drawLandmarks(canvasCtx, results.poseLandmarks, {color: '#ef4444', lineWidth: 1, radius: 2});
        }
        
        if (results.leftHandLandmarks) {
            drawConnectors(canvasCtx, results.leftHandLandmarks, HAND_CONNECTIONS, {color: '#fbbf24', lineWidth: 2});
            drawLandmarks(canvasCtx, results.leftHandLandmarks, {color: '#34d399', lineWidth: 1, radius: 3});
        }
        
        if (results.rightHandLandmarks) {
            drawConnectors(canvasCtx, results.rightHandLandmarks, HAND_CONNECTIONS, {color: '#c084fc', lineWidth: 2});
            drawLandmarks(canvasCtx, results.rightHandLandmarks, {color: '#34d399', lineWidth: 1, radius: 3});
        }

        const hasilBIM = tekaBIM(
            results.leftHandLandmarks, 
            results.rightHandLandmarks, 
            results.poseLandmarks
        );
        textOutput.innerText = hasilBIM;

    } else {
        statusMessage.innerText = "Sila pastikan badan/tangan anda kelihatan pada kamera.";
        statusMessage.style.color = "#f87171";
        textOutput.innerText = "...";
    }
    canvasCtx.restore();
}

// 3. KONFIGURASI MEDIAPIPE HOLISTIC
const holistic = new Holistic({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
});

holistic.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

holistic.onResults(onResults);

// 4. AKSES KAMERA (WEBRTC STANDARD)
if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } })
    .then(function(stream) {
        videoElement.srcObject = stream;
        videoElement.onloadedmetadata = function(e) {
            videoElement.play();
            statusMessage.innerText = "Kamera sedia. Sila lakukan isyarat.";
            statusMessage.style.color = "#38bdf8";
            
            async function hantarFrame() {
                if (!videoElement.paused && !videoElement.ended) {
                    await holistic.send({ image: videoElement });
                }
                requestAnimationFrame(hantarFrame);
            }
            hantarFrame();
        };
    })
    .catch(function(err) {
        statusMessage.innerText = "Gagal mengakses kamera: " + err.message;
        statusMessage.style.color = "#f87171";
    });
} else {
    statusMessage.innerText = "Pelayar anda tidak menyokong akses kamera.";
    statusMessage.style.color = "#f87171";
}
</script>

</body>
</html>
